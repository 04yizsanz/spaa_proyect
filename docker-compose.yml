services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c_laravel
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    networks:
      - red_db

  db:
    image: mysql:8.0
    container_name: c_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: "spaa_proyect"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red_db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: c_phpmyadmin
    restart: unless-stopped
    ports:
      - "8881:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - red_db

networks:
  red_db:

volumes:
  mysql_data:
  vendor:
