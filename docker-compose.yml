services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c_laravel
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/backend/vendor
    working_dir: /var/www/html/backend
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_db

  db:
    image: mysql:8.0
    container_name: c_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-spaa_proyect}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MYSQL_USER: ${DB_USERNAME:-spaa_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - red_db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: c_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8881:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-spaa_app}
      PMA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_db

networks:
  red_db:

volumes:
  mysql_data:
  vendor:
